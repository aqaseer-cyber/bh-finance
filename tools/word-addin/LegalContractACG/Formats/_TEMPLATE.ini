; ===========================================================================
;  TEMPLATE for a new format profile.
;
;  1. Copy this file, rename it (e.g. BoardResolution.ini) - files starting
;     with "_" are hidden from the ribbon menu.
;  2. Change [Format] Name and StylePrefix (the prefix keeps each format's
;     styles apart inside one document: "ACG Clause" vs "BR Clause").
;  3. Edit only the keys that differ from the defaults listed here.
;  4. Save as plain text (ANSI/UTF-8), drop it into the formats folder and
;     click Refresh on the Legal Contract ACG ribbon tab.
;
;  Units:    lengths accept 72 | 72pt | 1in | 2.54cm | 25.4mm (no unit = pt)
;  Colours:  auto | black | E7E6E6 | #C00000 | rgb(192,0,0)
;  Booleans: 1/0  yes/no  true/false
;  Inheritance: every style section falls back to [Body], then to the
;  built-in default shown in the comment.
; ===========================================================================

[Format]
Name        = My Format Name            ; shown on the ribbon menu
Version     = 1.0
Description = One line shown as the menu tooltip
StylePrefix = MYF                       ; style names become "MYF Clause" etc.

[Page]
Enabled        = 1                      ; 0 = leave page setup untouched
PaperSize      = A4                     ; A4 | Letter | Legal | A3
Orientation    = portrait               ; portrait | landscape
MarginTop      = 1in
MarginBottom   = 1in
MarginLeft     = 1in
MarginRight    = 1in
Gutter         = 0
HeaderDistance = 35.45pt
FooterDistance = 35.45pt

[Options]
ShowSummary               = 1           ; message box with counts after applying
ClearDirectFontFormatting = 1           ; force font name/size/colour to the style (bold/italic kept)
ClearHighlight            = 0           ; also remove text highlighting

; ---------------------------------------------------------------------------
; Style sections.  Keys available in EVERY style section:
;   StyleName      (default = section label)  name after the prefix
;   Font           (Times New Roman)
;   Size           (12)                        points
;   Bold / Italic / Underline / AllCaps (0)
;   Color          (auto)
;   Alignment      (justify)                   left | center | right | justify
;   LineSpacing    (1.15)                      multiple; a value >= 5 is treated as exact points
;   SpaceBefore    (0)   SpaceAfter (7)        lengths
;   LeftIndent     (0)   RightIndent (0)
;   HangingIndent  (0)                         > 0 makes a hanging indent
;   FirstLineIndent(0)                         used only when HangingIndent = 0
;   KeepWithNext / KeepTogether / PageBreakBefore (0)
;   OutlineLevel   (0)                         1-3 for the Navigation pane / TOC
;   ContextualSpacing (0)
;   NextStyle      (kind-dependent)            Body | Clause | same | ...
; Numbered sections (Article, Clause, SubClause) add:
;   NumberFormat   (%1.  |  %1.%2  |  %3))      %1 %2 %3 = level 1/2/3 counters
;   NumberStyle    (arabic | lowerletter | upperletter | lowerroman | upperroman | none)
;   NumberBold     (1 for Article/Clause, 0 for SubClause)
;   StartAt        (1)
;   BoldLeadIn     (1 for Clause)              bold "Heading." phrase at the start
;   LeadInStop     (.:)  LeadInMaxLength (70)  LeadInMaxWords (5)
;   LeadInSkipStarts (The|A|An|This|Each|No|...)  first words that mean "no lead-in"
; ---------------------------------------------------------------------------

[Body]
ApplyToNormal = 1                       ; also align Word's Normal style to this
Font          = Times New Roman
Size          = 12
Color         = auto
Alignment     = justify
LineSpacing   = 1.15
SpaceAfter    = 7

[Title]
Size        = 16
Bold        = 1
Alignment   = center
SpaceBefore = 18
SpaceAfter  = 4

[Subtitle]
Bold       = 1
Alignment  = center
SpaceAfter = 18

[Recital]
LeftIndent    = 1cm
HangingIndent = 1cm
SpaceAfter    = 5
BoldLeadIn    = 1                       ; bold the party name up to LeadInStop
LeadInStop    = ,
LeadInMaxLength = 90

[Heading]
Bold         = 1
AllCaps      = 1
Alignment    = left
SpaceBefore  = 18
SpaceAfter   = 7
KeepWithNext = 1
OutlineLevel = 1

[Article]
Bold          = 1
AllCaps       = 1
Alignment     = left
SpaceBefore   = 18
SpaceAfter    = 7
LeftIndent    = 18
HangingIndent = 18
KeepWithNext  = 1
OutlineLevel  = 1
NumberFormat  = %1.
NumberStyle   = arabic
NumberBold    = 1

[Clause]
LeftIndent    = 39.6
HangingIndent = 21.6
OutlineLevel  = 2
NumberFormat  = %1.%2.
NumberStyle   = arabic
NumberBold    = 1
BoldLeadIn    = 1

[SubClause]
LeftIndent    = 54
HangingIndent = 18
SpaceAfter    = 5
NumberFormat  = %3)
NumberStyle   = lowerletter
NumberBold    = 0

[Quote]
LeftIndent = 18

[Signature]
Alignment     = left
SpaceAfter    = 10
BoldLabels    = 1                       ; bold "Name:" style labels
WholeLineBold = For the|For and on behalf|Signed for|Executed by

[ScheduleHeading]
Bold            = 1
AllCaps         = 1
Alignment       = center
SpaceBefore     = 18
SpaceAfter      = 7
KeepWithNext    = 1
OutlineLevel    = 1
PageBreakBefore = 1

[TableHeading]
Bold        = 1
Alignment   = left
LineSpacing = 1.0
SpaceAfter  = 0

[TableText]
Alignment   = left
LineSpacing = 1.0
SpaceAfter  = 0

[Table]
Enabled           = 1                   ; 0 = leave tables alone
Borders           = 1
BorderWidth       = 0.5                 ; 0.25 | 0.5 | 0.75 | 1 | 1.5
FirstRowIsHeader  = 1                   ; shade + bold + repeat on each page
SignatureTableWords = Signed|Signature|For and on behalf|For the|Name:|Witness   ; tables whose first row has these get no header row
HeaderShade       = E7E6E6
CellPaddingTop    = 3
CellPaddingBottom = 3
CellPaddingLeft   = 5
CellPaddingRight  = 5

[Footer]
Replace   = 1                           ; 0 = leave existing footer alone
Text      = Page {PAGE} of {NUMPAGES}   ; tokens: {PAGE} {NUMPAGES} {SECTIONPAGES} {DATE} {FILENAME} {TITLE}
Alignment = center
Size      = 9
Bold      = 0
Italic    = 0

[Header]
Replace   = 0
Text      =
Alignment = right
Size      = 9

; ---------------------------------------------------------------------------
; Classification tuning (how a draft's paragraphs are recognised)
; ---------------------------------------------------------------------------
[Classify]
MaxHeadingLength        = 80            ; ALL CAPS lines up to this length become Article headings
MaxTitleLength          = 120           ; first paragraph up to this length becomes the Title
MaxSignatureLineLength  = 150           ; inside the signature block, longer lines stay Body
BoldLineIsHeading       = 1             ; a short, fully bold line is treated as an Article heading
FrontNumbersAreRecitals = 1             ; "1." lines before the first article stay as typed recitals
ScheduleWords           = SCHEDULE|ANNEX|ANNEXURE|APPENDIX|EXHIBIT|ATTACHMENT
FrontHeadingWords       = BACKGROUND|RECITALS|WHEREAS|PRELIMINARY|INTRODUCTION|PARTIES|BETWEEN|AND|NOW THEREFORE|NOW, THEREFORE|OPERATIVE PROVISIONS|IT IS AGREED
FrontHeadingMaxWords    = 3             ; ALL CAPS lines up to this many words before the first article stay unnumbered
SignatureHeadingWords   = SIGNATURE|SIGNED|EXECUTION|WITNESS|EXECUTED
SignatureLabels         = Name:|Title:|Position:|Signature:|Signed:|Date:|Email:|E-mail:|Telephone:|Tel:|Company stamp|Stamp:|Witness:|By:|Designation:
MaxSignatureLabelLength = 70            ; label lines longer than this are not signature lines outside the signature block
