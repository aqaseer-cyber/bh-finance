; ===========================================================================
;  Legal Contract ACG - format profile
;  Extracted from "Format for AGREEMENT.docx" (Consultancy Agreement).
;
;  Lengths accept units:  72 | 72pt | 1in | 2.54cm | 25.4mm   (no unit = points)
;  Colours accept:        auto | black | E7E6E6 | #C00000 | rgb(192,0,0)
;  Booleans accept:       1/0  yes/no  true/false
;  Every style section inherits unspecified keys from [Body].
;  See _TEMPLATE.ini for the full key reference.
; ===========================================================================

[Format]
Name        = Legal Contract ACG
Version     = 1.0
Description = Almoayyed Contracting Group agreement layout: Times New Roman 12, A4, 1in margins, numbered articles 1. / clauses 1.1. / sub-clauses a), Page X of Y footer.
StylePrefix = ACG

[Page]
Enabled        = 1
PaperSize      = A4
Orientation    = portrait
MarginTop      = 1in
MarginBottom   = 1in
MarginLeft     = 1in
MarginRight    = 1in
HeaderDistance = 35.45pt
FooterDistance = 35.45pt

[Options]
ShowSummary               = 1
ClearDirectFontFormatting = 1
ClearHighlight            = 0

; ---------------------------------------------------------------------------
; Body text - the base every other style inherits from
; ---------------------------------------------------------------------------
[Body]
ApplyToNormal = 1
Font          = Times New Roman
Size          = 12
Color         = auto
Alignment     = justify
LineSpacing   = 1.15
SpaceBefore   = 0
SpaceAfter    = 7
LeftIndent    = 0
HangingIndent = 0

; "CONSULTANCY AGREEMENT"
[Title]
Size        = 16
Bold        = 1
Alignment   = center
SpaceBefore = 18
SpaceAfter  = 4
KeepWithNext = 1

; "(Trial Engagement)"
[Subtitle]
Size        = 12
Bold        = 1
Alignment   = center
SpaceAfter  = 18

; "(1) Almoayyed Contracting Group W.L.L., Commercial Registration ..."
; The typed "(1)" is kept; the party name up to the first comma is bolded.
[Recital]
LeftIndent     = 1cm
HangingIndent  = 1cm
SpaceAfter     = 5
BoldLeadIn     = 1
LeadInStop     = ,
LeadInMaxLength = 90

; Unnumbered headings such as SIGNATURES
[Heading]
Bold         = 1
AllCaps      = 1
Alignment    = left
SpaceBefore  = 18
SpaceAfter   = 7
KeepWithNext = 1
OutlineLevel = 1

; "1.  ENGAGEMENT AND SERVICES"
[Article]
Bold          = 1
AllCaps       = 1
Alignment     = left
SpaceBefore   = 18
SpaceAfter    = 7
LeftIndent    = 18
HangingIndent = 18
KeepWithNext  = 1
OutlineLevel  = 1
NumberFormat  = %1.
NumberStyle   = arabic
NumberBold    = 1
BoldLeadIn    = 0

; "1.1.  Engagement. The Client engages ..."
[Clause]
LeftIndent    = 39.6
HangingIndent = 21.6
SpaceAfter    = 7
OutlineLevel  = 2
NumberFormat  = %1.%2.
NumberStyle   = arabic
NumberBold    = 1
BoldLeadIn    = 1
LeadInStop    = .:
LeadInMaxLength = 70
LeadInMaxWords  = 7

; "a)  identify and introduce ..."
[SubClause]
LeftIndent    = 54
HangingIndent = 18
SpaceAfter    = 5
NumberFormat  = %3)
NumberStyle   = lowerletter
NumberBold    = 0
BoldLeadIn    = 0

; Indented unnumbered paragraph (e.g. the non-compete paragraph under 1.6)
[Quote]
LeftIndent = 18
SpaceAfter = 7

; Name: / Title: / Signature: / Date: / Company stamp:
[Signature]
Alignment   = left
SpaceAfter  = 10
BoldLabels  = 1
WholeLineBold = For the|For and on behalf|Signed for|Executed by

; "SCHEDULE 1" - centred, starts a new page
[ScheduleHeading]
Bold            = 1
AllCaps         = 1
Alignment       = center
SpaceBefore     = 18
SpaceAfter      = 7
KeepWithNext    = 1
OutlineLevel    = 1
PageBreakBefore = 1

[TableHeading]
Bold        = 1
Alignment   = left
LineSpacing = 1.0
SpaceAfter  = 0

[TableText]
Alignment   = left
LineSpacing = 1.0
SpaceAfter  = 0

[Table]
Enabled           = 1
Borders           = 1
BorderWidth       = 0.5
FirstRowIsHeader  = 1
HeaderShade       = E7E6E6
CellPaddingTop    = 3
CellPaddingBottom = 3
CellPaddingLeft   = 5
CellPaddingRight  = 5

; Footer: "Page 1 of 7" centred, 9pt.  Tokens: {PAGE} {NUMPAGES} {DATE} {FILENAME}
[Footer]
Replace   = 1
Text      = Page {PAGE} of {NUMPAGES}
Alignment = center
Size      = 9

; Header is left untouched (the source document has an empty header)
[Header]
Replace   = 0
Text      =
Alignment = right
Size      = 9

[Classify]
MaxHeadingLength       = 80
MaxTitleLength         = 120
MaxSignatureLineLength = 150
BoldLineIsHeading      = 1
FrontNumbersAreRecitals = 1
ScheduleWords          = SCHEDULE|ANNEX|ANNEXURE|APPENDIX|EXHIBIT|ATTACHMENT
FrontHeadingWords      = BACKGROUND|RECITALS|WHEREAS|PRELIMINARY|INTRODUCTION|PARTIES
SignatureHeadingWords  = SIGNATURE|SIGNED|EXECUTION|WITNESS|EXECUTED
SignatureLabels        = Name:|Title:|Position:|Signature:|Signed:|Date:|Email|E-mail|Telephone|Tel:|Company stamp|Stamp:|Witness|For and on behalf|For the|By:|Designation:
